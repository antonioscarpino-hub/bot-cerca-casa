name: bot

on:
  schedule:
    # Ogni 20 minuti: risponde ai comandi Telegram. Le fonti si controllano ogni SCRAPE_EVERY_MIN minuti.
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Controlla solo le fonti il cui nome contiene questo testo (vuoto = giro normale)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Giro del bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_ALLOWED_CHATS: ${{ secrets.TELEGRAM_ALLOWED_CHATS }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          SCRAPE_EVERY_MIN: ${{ vars.SCRAPE_EVERY_MIN || '180' }}
          ONLY: ${{ inputs.only }}
        run: python -m botcasa.main --only "$ONLY"
      - name: Salva lo stato
        run: |
          git config user.name "bot-cerca-casa"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet && exit 0
          git commit -m "Aggiorna stato del bot [skip ci]"
          git pull --rebase origin main && git push
